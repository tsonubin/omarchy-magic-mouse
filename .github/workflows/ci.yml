name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  e2e:
    name: end-to-end (emulated Omarchy)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Load the uinput kernel module
        run: sudo modprobe uinput
      - name: Run the E2E suite in the emulated Omarchy environment
        run: test/e2e/run.sh
